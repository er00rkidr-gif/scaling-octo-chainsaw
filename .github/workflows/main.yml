
name: Build Pip Horror Mod

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract mod ZIP
        run: |
          set -e
          find . -type f -name '*.zip' -not -path './.git/*' -print0 |
          while IFS= read -r -d '' file; do
            unzip -oq "$file" -d .
          done

          BUILD_FILE=$(find . -type f -name build.gradle -not -path './.git/*' -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Pip-Horror-Mod
          path: '**/build/libs/*.jar'
